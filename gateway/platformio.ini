; PlatformIO Project Configuration File – KnockKnock Gateway
;
; Target: ESP32-C3 DevKitM-1
; Framework: ESP-IDF (native)

[env:esp32-c3-devkitm-1]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = espidf

; ── Custom partition table ───────────────────────────────────────────────────
board_build.partitions = partitions.csv

; ── sdkconfig defaults (flash encryption, hw AES, NVS encryption) ───────────
board_build.sdkconfig_defaults = sdkconfig.defaults

; ── Upload / monitor ─────────────────────────────────────────────────────────
monitor_speed = 115200
upload_speed  = 921600

; ── Build flags ──────────────────────────────────────────────────────────────
; General build flags (if you add any others later, put them here)
build_flags =
    ; e.g., -D SOME_OTHER_MACRO

; Apply the log level ONLY to your project's source files to avoid redefining ESP-IDF macros
build_src_flags =
    -D LOG_LOCAL_LEVEL=ESP_LOG_INFO
