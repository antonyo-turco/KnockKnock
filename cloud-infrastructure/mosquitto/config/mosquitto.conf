# Internal listener — reachable only within the Docker network (not exposed on host).
# Used by Telegraf and the Python backend.
listener 1883
allow_anonymous true

# TLS listener — exposed on host port 8883 for ESP32 edge hubs.
listener 8883
allow_anonymous true
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false

persistence true
persistence_location /mosquitto/data/
log_dest stdout
